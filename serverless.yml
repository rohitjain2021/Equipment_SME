service: equipment-sme
frameworkVersion: '4'
configValidationMode: error

provider:
  name: aws
  runtime: python3.13
  profile: ${opt:aws-profile, 'default'}
  region: us-east-1
  stage: ${opt:stage, 'Prod'}
  memorySize: 128
  timeout: 123
  endpointType: REGIONAL
  stackParameters:
    - ParameterKey: AlertEmail
      ParameterValue: ${param:alertEmail, env:ALERT_EMAIL}
  # Omit logRetentionInDays to match the existing log group's indefinite retention.
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource:
            - arn:aws:bedrock:${aws:region}::foundation-model/amazon.nova-pro-v1:0
        - Effect: Allow
          Action: bedrock:ApplyGuardrail
          Resource:
            Fn::GetAtt: [EquipmentGuardrail, GuardrailArn]

package:
  individually: true
  patterns:
    - '!**'
    - lambda_function.py

functions:
  notifyBedrockInvocation:
    handler: infrastructure.bedrock_notifications.handler
    timeout: 30
    memorySize: 128
    logRetentionInDays: 30
    role:
      Fn::GetAtt: [BedrockNotificationRole, Arn]
    environment:
      ALERT_TOPIC_ARN: {Ref: BedrockInvocationAlertTopic}
      BEDROCK_MODEL_ID: amazon.nova-pro-v1:0
    package:
      patterns:
        - '!lambda_function.py'
        - infrastructure/bedrock_notifications.py
  configureBedrockLogging:
    handler: infrastructure.bedrock_logging.handler
    timeout: 90
    memorySize: 128
    logRetentionInDays: 30
    role:
      Fn::GetAtt: [BedrockLoggingConfigurationRole, Arn]
    package:
      patterns:
        - '!lambda_function.py'
        - infrastructure/bedrock_logging.py
  summarize:
    # Keep generated names: existing AWS resources are not imported here.
    handler: lambda_function.lambda_handler
    environment:
      BEDROCK_GUARDRAIL_ID: {Fn::GetAtt: [EquipmentGuardrail, GuardrailId]}
      BEDROCK_GUARDRAIL_VERSION: {Fn::GetAtt: [EquipmentGuardrailVersionV1, Version]}
    events:
      - http:
          path: /
          method: post
          integration: lambda
          private: false
          timeoutInMillis: 29000
          request:
            contentHandling: CONVERT_TO_TEXT
            passThrough: WHEN_NO_MATCH
            template:
              application/json: >-
                { "prompt": $input.json('$.prompt') }
              application/x-www-form-urlencoded: null
          response:
            # Preserve the Lambda's complete statusCode/body response envelope.
            template: $input.body
            statusCodes:
              200:
                pattern: ''

resources:
  - ${file(infrastructure/bedrock-logging.yml)}
  - ${file(infrastructure/bedrock-alerts.yml)}
  - ${file(infrastructure/bedrock-guardrails.yml)}
