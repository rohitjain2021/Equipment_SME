<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Equipment SME solution architecture</title>
  <desc id="description">Within an AWS Cloud boundary, the Equipment SME sends a summarize-text prompt through API Gateway to Lambda. Lambda sends a user prompt and system prompt to Amazon Bedrock and returns the generated summary.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#687386"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .service-label { font-size: 17px; font-weight: 700; }
      .flow-label { font-size: 13px; font-weight: 600; fill: #384253; }
      .caption { font-size: 12px; fill: #536174; }
    </style>
  </defs>

  <rect width="1200" height="430" rx="12" fill="#fbfafc"/>
  <text x="48" y="48" font-size="27" font-weight="400" fill="#45434a">Production-Grade Solution Architecture</text>
  <path d="M48 67 H1152" stroke="#d84a36" stroke-width="2"/>

  <rect x="48" y="92" width="1104" height="294" rx="7" fill="#fff" stroke="#2e3440" stroke-width="1.5"/>
  <path d="M49 99a6 6 0 0 1 6-6h31v32H49z" fill="#273444"/>
  <text x="56" y="113" font-size="12" font-weight="700" fill="#fff">aws</text>
  <text x="99" y="115" font-size="14" fill="#222">AWS Cloud</text>

  <g aria-label="Equipment SME">
    <circle cx="146" cy="190" r="16" fill="#f7f8fa" stroke="#29313d" stroke-width="2"/>
    <path d="M131 190q1-21 16-21 14 0 15 21m-28-4q4-10 12-8 9 3 13 0m-31 31q2-21 20-21 19 0 21 21v14h-45z" fill="#f7f8fa" stroke="#29313d" stroke-width="2" stroke-linejoin="round"/>
    <path d="M153 204h27v16h-27m4 0v5m19-5v5m-29 0h39" fill="none" stroke="#29313d" stroke-width="2" stroke-linecap="round"/>
    <path d="M162 200q7-9 13 0m-11 4q5-5 9 0" fill="none" stroke="#4d6678" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="177" cy="201" r="3" fill="#4d6678"/>
    <text x="146" y="278" text-anchor="middle" class="service-label" fill="#6d3a91">Equipment SME</text>
    <text x="146" y="298" text-anchor="middle" class="caption">User / analyst</text>
  </g>

  <g aria-label="Summarization request">
    <rect x="278" y="142" width="28" height="34" rx="2" fill="#fff" stroke="#526071" stroke-width="1.8"/>
    <path d="M284 150h16m-16 5h16m-16 5h12m-12 5h15" stroke="#526071" stroke-width="1.6"/>
    <text x="290" y="199" text-anchor="middle" class="flow-label">prompt =</text>
    <text x="290" y="216" text-anchor="middle" class="flow-label">Summarize text</text>
  </g>

  <path d="M202 225 H278" fill="none" stroke="#687386" stroke-width="1.7" marker-end="url(#arrow)"/>
  <g aria-label="Amazon API Gateway">
    <rect x="359" y="166" width="98" height="88" rx="4" fill="#9146ff"/>
    <path d="M377 184l-14 9v34l14 9m61-52 14 9v34l-14 9m-22-47-11 38m-10-25h9m22 0h9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M398 187v44m21-44v44m-10-30 9 8-9 8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="408" y="278" text-anchor="middle" class="service-label" fill="#70409a">AWS API Gateway</text>
  </g>

  <g aria-label="Lambda event prompt">
    <rect x="525" y="142" width="28" height="34" rx="2" fill="#fff" stroke="#526071" stroke-width="1.8"/>
    <path d="M531 150h16m-16 5h16m-16 5h12m-12 5h15" stroke="#526071" stroke-width="1.6"/>
    <text x="539" y="199" text-anchor="middle" class="flow-label">event[&quot;prompt&quot;]</text>
  </g>

  <path d="M457 210 H503" fill="none" stroke="#687386" stroke-width="1.7" marker-end="url(#arrow)"/>
  <g aria-label="AWS Lambda">
    <rect x="601" y="166" width="94" height="88" rx="4" fill="#f58b00"/>
    <path d="M626 180h17l23 48h-16l-5-11h-11l-6 11h-16l13-21-10-20h16l4 9 6-16h-10z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="648" y="278" text-anchor="middle" class="service-label" fill="#70409a">AWS Lambda</text>
  </g>
  <path d="M553 210 H584" fill="none" stroke="#687386" stroke-width="1.7" marker-end="url(#arrow)"/>

  <g aria-label="User and system prompts">
    <rect x="772" y="142" width="28" height="34" rx="2" fill="#fff" stroke="#526071" stroke-width="1.8"/>
    <path d="M778 150h16m-16 5h16m-16 5h12m-12 5h15" stroke="#526071" stroke-width="1.6"/>
    <text x="813" y="163" class="flow-label">User prompt</text>
    <text x="813" y="181" class="flow-label">+ system prompt</text>
  </g>

  <path d="M695 210 H750" fill="none" stroke="#687386" stroke-width="1.7" marker-end="url(#arrow)"/>
  <g aria-label="Amazon Bedrock">
    <rect x="956" y="166" width="88" height="88" rx="4" fill="#12a991"/>
    <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1000 185v12m0 0-11 7m11-7 12 7m-23 0v13m23-13v13m-23-13-11 7m11-7 10 7m13-7 11 7m-11-7-10 7m-13 6-11 7m11-7 10 7m13-7 11 7m-11-7-10 7"/>
      <path d="M1000 184l7 4v8l-7 4-7-4v-8zm-23 14 5 3v6l-5 3-5-3v-6zm46 0 5 3v6l-5 3-5-3v-6zm-46 29 5 3v6l-5 3-5-3v-6zm46 0 5 3v6l-5 3-5-3v-6z"/>
      <circle cx="1000" cy="218" r="4"/>
    </g>
    <text x="1000" y="278" text-anchor="middle" class="service-label" fill="#70409a">Amazon Bedrock</text>
  </g>

  <path d="M802 210 H924" fill="none" stroke="#687386" stroke-width="1.7" marker-end="url(#arrow)"/>
</svg>
