<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-labelledby="title description">
  <title id="title">Equipment SME solution architecture</title>
  <desc id="description">Within an AWS Cloud boundary, the Equipment SME sends a summarize-text prompt through API Gateway to Lambda. Lambda sends a user prompt and system prompt to Amazon Bedrock and returns the generated summary. Bedrock publishes native metrics to CloudWatch automatically. Text invocation logging to CloudWatch Logs is enabled through the infrastructure deployment.</desc>
